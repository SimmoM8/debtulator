spring:
  application:
    name: debtulator-backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  web:
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never

  logging:
    level:
      org.springframework.security: DEBUG
      org.springframework.security.oauth2: DEBUG
      com.debtulator.backend.security.ApiAuthenticationEntryPoint: DEBUG

server:
  port: ${PORT:8787}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never

debtulator:
  auth:
    supabase:
      base-url: ${SUPABASE_URL}
      api-key: ${SUPABASE_AUTH_API_KEY}
      signup-redirect-url: ${AUTH_SIGNUP_REDIRECT_URL:debtulator://auth/confirm}
      recovery-redirect-url: ${AUTH_RECOVERY_REDIRECT_URL:debtulator://auth/reset-password}
      forward-client-ip: ${SUPABASE_AUTH_FORWARD_CLIENT_IP:false}

  security:
    jwt:
      issuer: ${SUPABASE_JWT_ISSUER}
      jwk-set-uri: ${SUPABASE_JWKS_URI}
      audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
