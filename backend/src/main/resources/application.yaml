spring:
  application:
    name: debtulator-backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  web:
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never

debtulator:
  security:
    jwt:
      issuer: ${SUPABASE_JWT_ISSUER}
      jwk-set-uri: ${SUPABASE_JWKS_URI}
      audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
