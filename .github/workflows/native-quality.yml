name: Native Quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app.json"
      - "eas.json"
      - "metro.config.js"
      - "package.json"
      - "package-lock.json"
      - "patches/**"
      - "plugins/**"
      - ".github/workflows/native-quality.yml"
  push:
    branches:
      - main
    paths:
      - "app.json"
      - "eas.json"
      - "metro.config.js"
      - "package.json"
      - "package-lock.json"
      - "patches/**"
      - "plugins/**"
      - ".github/workflows/native-quality.yml"

permissions:
  contents: read

jobs:
  android:
    name: Clean Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: npm ci
      - run: npx expo prebuild --clean --no-install --platform android
      - working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

  ios:
    name: Clean unsigned iOS simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --clean --no-install --platform ios
      - working-directory: ios
        run: pod install
      - working-directory: ios
        run: >-
          xcodebuild
          -workspace Debtulator.xcworkspace
          -scheme Debtulator
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
