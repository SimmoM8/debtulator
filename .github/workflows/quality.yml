name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  quality:
    name: Architecture, typecheck, lint, test, and export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: npm

      - name: Install
        run: npm ci

      - name: Release config preflight
        run: npm run release:preflight:config -- --env=staging

      - name: Check Expo dependency versions
        working-directory: apps/mobile
        run: npx expo install --check

      - name: Check architecture boundaries
        run: npm run architecture

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: Export all platforms
        working-directory: apps/mobile
        run: npx expo export --platform all --output-dir ../../dist --clear
