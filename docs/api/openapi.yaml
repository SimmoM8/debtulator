openapi: 3.1.0
info:
  title: Debtulator Collaboration API
  version: 1.0.0
  description: Versioned HTTP API for authenticated collaboration and account workflows.
servers:
  - url: https://api.example.invalid/api/v1
    description: Production placeholder; configure per deployment.
tags:
  - name: member-directory
    description: Directory operations for collaboration.
paths:
  /member-profiles:
    get:
      operationId: searchMemberProfiles
      tags: [member-directory]
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: excludeUserId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Matching profiles visible to the authenticated caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSearchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        default:
          $ref: "#/components/responses/UnexpectedProblem"
  /member-links:
    post:
      operationId: createMemberLink
      tags: [member-directory]
      security: [{ bearerAuth: [] }]
      responses:
        {
          "201": { description: Member link created. },
          default: { $ref: "#/components/responses/UnexpectedProblem" },
        }
  /member-links/respond:
    post:
      operationId: respondToMemberLink
      tags: [member-directory]
      security: [{ bearerAuth: [] }]
      responses:
        {
          "200": { description: Member link response recorded. },
          default: { $ref: "#/components/responses/UnexpectedProblem" },
        }
  /debt-verifications:
    post:
      operationId: createDebtVerification
      security: [{ bearerAuth: [] }]
      responses:
        {
          "201": { description: Debt verification created. },
          default: { $ref: "#/components/responses/UnexpectedProblem" },
        }
  /debt-verifications/respond:
    post:
      operationId: respondToDebtVerification
      security: [{ bearerAuth: [] }]
      responses:
        {
          "200": { description: Debt verification response recorded. },
          default: { $ref: "#/components/responses/UnexpectedProblem" },
        }
  /debt-verifications/counter:
    post:
      operationId: counterDebtVerification
      security: [{ bearerAuth: [] }]
      responses:
        {
          "201": { description: Counterproposal created. },
          default: { $ref: "#/components/responses/UnexpectedProblem" },
        }
  /debt-verifications/remind:
    post:
      operationId: remindDebtVerification
      security: [{ bearerAuth: [] }]
      responses:
        {
          "200": { description: Reminder sent. },
          default: { $ref: "#/components/responses/UnexpectedProblem" },
        }
  /payment-confirmations/respond:
    post:
      operationId: respondToPaymentConfirmation
      security: [{ bearerAuth: [] }]
      responses:
        {
          "200": { description: Payment confirmation response recorded. },
          default: { $ref: "#/components/responses/UnexpectedProblem" },
        }
  /payment-confirmations/remind:
    post:
      operationId: remindPaymentConfirmation
      security: [{ bearerAuth: [] }]
      responses:
        {
          "200": { description: Reminder sent. },
          default: { $ref: "#/components/responses/UnexpectedProblem" },
        }
  /group-invites:
    post:
      operationId: createGroupInvite
      security: [{ bearerAuth: [] }]
      responses:
        {
          "201": { description: Group invite created. },
          default: { $ref: "#/components/responses/UnexpectedProblem" },
        }
  /group-members:
    post:
      operationId: createGroupMember
      security: [{ bearerAuth: [] }]
      responses:
        {
          "201": { description: Group member created. },
          default: { $ref: "#/components/responses/UnexpectedProblem" },
        }
  /attachments:
    post:
      operationId: uploadAttachment
      security: [{ bearerAuth: [] }]
      responses:
        {
          "201": { description: Attachment uploaded. },
          default: { $ref: "#/components/responses/UnexpectedProblem" },
        }
  /account/deletion:
    get:
      operationId: getDeletionStatus
      security: [{ bearerAuth: [] }]
      responses:
        {
          "200": { description: Deletion status. },
          default: { $ref: "#/components/responses/UnexpectedProblem" },
        }
    post:
      operationId: requestAccountDeletion
      security: [{ bearerAuth: [] }]
      responses:
        {
          "201": { description: Deletion requested. },
          default: { $ref: "#/components/responses/UnexpectedProblem" },
        }
  /telemetry/events:
    post:
      operationId: recordTelemetryEvent
      security: [{ bearerAuth: [] }]
      responses:
        {
          "201": { description: Telemetry recorded. },
          default: { $ref: "#/components/responses/UnexpectedProblem" },
        }
  /sync:
    post:
      operationId: syncLocalChanges
      security: [{ bearerAuth: [] }]
      responses:
        {
          "201": { description: Sync batch processed. },
          default: { $ref: "#/components/responses/UnexpectedProblem" },
        }
  /sync/stage-two:
    post:
      operationId: fetchSyncStageTwo
      security: [{ bearerAuth: [] }]
      responses:
        {
          "201": { description: Sync stage two fetched. },
          default: { $ref: "#/components/responses/UnexpectedProblem" },
        }
  /development/reset-data:
    post:
      operationId: resetDevelopmentData
      security: [{ bearerAuth: [] }]
      responses:
        {
          "201": { description: Development data reset. },
          default: { $ref: "#/components/responses/UnexpectedProblem" },
        }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    MemberProfile:
      type: object
      required:
        [id, firstName, lastName, displayName, email, avatarUrl, baseCurrency]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: [string, "null"] }
        lastName: { type: [string, "null"] }
        displayName: { type: string }
        email: { type: [string, "null"], format: email }
        avatarUrl: { type: [string, "null"], format: uri }
        baseCurrency: { type: string, minLength: 3, maxLength: 3 }
    ProfileSearchResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [items, nextCursor]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/MemberProfile" }
            nextCursor: { type: [string, "null"] }
        requestId: { type: string }
    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [pointer, message]
            properties:
              pointer: { type: string }
              message: { type: string }
  responses:
    Unauthorized:
      description: Authentication is required or the access token is invalid.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    ValidationProblem:
      description: The request failed input validation.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    UnexpectedProblem:
      description: An unexpected server error.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
